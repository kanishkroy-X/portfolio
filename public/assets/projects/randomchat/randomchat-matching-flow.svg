<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 180" fill="none">
  <defs>
    <pattern id="flowGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#262628" stroke-width="0.5"/>
    </pattern>
  </defs>

  <rect width="900" height="180" rx="12" fill="#0E0E10" stroke="#222225" stroke-width="1"/>
  <rect width="900" height="180" rx="12" fill="url(#flowGrid)" opacity="0.4"/>

  <text x="24" y="30" fill="#8E8E93" font-family="'JetBrains Mono', 'SF Mono', monospace" font-size="11" font-weight="600" letter-spacing="1.5">RANDOMCHAT // USER MATCHING &amp; PROGRESSION FLOW</text>

  <!-- Flow Steps -->
  <!-- 01: ENTER -->
  <g transform="translate(30, 52)">
    <rect width="135" height="95" rx="8" fill="#161618" stroke="#2A2A2E" stroke-width="1"/>
    <text x="14" y="26" fill="#6B6B6B" font-family="'JetBrains Mono', monospace" font-size="10">STAGE 01</text>
    <text x="14" y="50" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="14" font-weight="700">Enter</text>
    <text x="14" y="70" fill="#8E8E93" font-family="'Inter', sans-serif" font-size="11">Anonymous Landing</text>
    <text x="14" y="84" fill="#55555A" font-family="'Inter', sans-serif" font-size="10">Zero Login Required</text>
  </g>

  <!-- Arrow 1 -->
  <path d="M175 100 H200" stroke="#8E8E93" stroke-width="1.5"/>
  <polygon points="202,100 196,97 196,103" fill="#8E8E93"/>

  <!-- 02: PREFERENCE -->
  <g transform="translate(205, 52)">
    <rect width="135" height="95" rx="8" fill="#161618" stroke="#2A2A2E" stroke-width="1"/>
    <text x="14" y="26" fill="#6B6B6B" font-family="'JetBrains Mono', monospace" font-size="10">STAGE 02</text>
    <text x="14" y="50" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="14" font-weight="700">Preference</text>
    <text x="14" y="70" fill="#8E8E93" font-family="'Inter', sans-serif" font-size="11">Gender &amp; Topic Queue</text>
    <text x="14" y="84" fill="#55555A" font-family="'Inter', sans-serif" font-size="10">Deterministic Match</text>
  </g>

  <!-- Arrow 2 -->
  <path d="M350 100 H375" stroke="#8E8E93" stroke-width="1.5"/>
  <polygon points="377,100 371,97 371,103" fill="#8E8E93"/>

  <!-- 03: MATCH -->
  <g transform="translate(380, 52)">
    <rect width="135" height="95" rx="8" fill="#161618" stroke="#3157FF" stroke-width="1.25"/>
    <text x="14" y="26" fill="#3157FF" font-family="'JetBrains Mono', monospace" font-size="10">STAGE 03</text>
    <text x="14" y="50" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="14" font-weight="700">Match</text>
    <text x="14" y="70" fill="#8E8E93" font-family="'Inter', sans-serif" font-size="11">Durable Object Pair</text>
    <text x="14" y="84" fill="#3157FF" font-family="'Inter', sans-serif" font-size="10">Direct Edge Pairing</text>
  </g>

  <!-- Arrow 3 -->
  <path d="M525 100 H550" stroke="#3157FF" stroke-width="1.5"/>
  <polygon points="552,100 546,97 546,103" fill="#3157FF"/>

  <!-- 04: CHAT -->
  <g transform="translate(555, 52)">
    <rect width="135" height="95" rx="8" fill="#161618" stroke="#2A2A2E" stroke-width="1"/>
    <text x="14" y="26" fill="#6B6B6B" font-family="'JetBrains Mono', monospace" font-size="10">STAGE 04</text>
    <text x="14" y="50" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="14" font-weight="700">Chat</text>
    <text x="14" y="70" fill="#8E8E93" font-family="'Inter', sans-serif" font-size="11">Ephemeral Text Room</text>
    <text x="14" y="84" fill="#55555A" font-family="'Inter', sans-serif" font-size="10">Instant Next / Skip</text>
  </g>

  <!-- Arrow 4 -->
  <path d="M700 100 H725" stroke="#8E8E93" stroke-width="1.5"/>
  <polygon points="727,100 721,97 721,103" fill="#8E8E93"/>

  <!-- 05: VOICE UNLOCK -->
  <g transform="translate(730, 52)">
    <rect width="140" height="95" rx="8" fill="#1A1A22" stroke="#4F46E5" stroke-width="1.25"/>
    <text x="14" y="26" fill="#818CF8" font-family="'JetBrains Mono', monospace" font-size="10">STAGE 05</text>
    <text x="14" y="50" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="14" font-weight="700">Voice Unlock</text>
    <text x="14" y="70" fill="#8E8E93" font-family="'Inter', sans-serif" font-size="11">Mutual Consent</text>
    <text x="14" y="84" fill="#818CF8" font-family="'Inter', sans-serif" font-size="10">Peer-to-Peer WebRTC</text>
  </g>
</svg>

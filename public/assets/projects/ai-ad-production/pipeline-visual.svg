    <text x="12" y="66" fill="#6B6B6B" font-family="'JetBrains Mono', monospace" font-size="9">02 / BRAND ANALYSIS</text>
    <text x="12" y="80" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="12" font-weight="600">Visual Codes &amp; Competitors</text>


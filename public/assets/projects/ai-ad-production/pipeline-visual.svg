<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" fill="none">
  <defs>
    <pattern id="pipeGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#262628" stroke-width="0.5"/>
    </pattern>
    <linearGradient id="pipeBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3157FF"/>

  <!-- Bottom pipeline connection stream -->
  <line x1="24" y1="295" x2="976" y2="295" stroke="#222226" stroke-width="1"/>
  <line x1="24" y1="295" x2="600" y2="295" stroke="url(#pipeBlue)" stroke-width="2"/>
  <circle cx="600" cy="295" r="4" fill="#3157FF"/>
  <text x="24" y="312" fill="#55555A" font-family="'JetBrains Mono', monospace" font-size="10.5">ELIMINATES AI DRIFT • PHOTOREALISTIC MATERIAL RETENTION • FRAME-ACCURATE TEMPO</text>

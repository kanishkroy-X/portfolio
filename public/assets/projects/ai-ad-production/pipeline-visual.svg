    <rect x="0" y="0" width="225" height="22" rx="4" fill="#1C1C20"/>
    <text x="10" y="15" fill="#A1A1AA" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="600" letter-spacing="1">01 / STRATEGY &amp; CONCEPT</text>

    <!-- Phase 2 -->
    <rect x="240" y="0" width="225" height="22" rx="4" fill="#1C1C20"/>
    <text x="250" y="15" fill="#A1A1AA" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="600" letter-spacing="1">02 / PRE-VIS &amp; PROMPT ARCH</text>


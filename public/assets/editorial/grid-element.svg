<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" fill="none">
  <!-- Subtle Technical Grid Element -->
  <defs>
    <pattern id="techGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="currentColor" stroke-width="0.5" stroke-opacity="0.12"/>
    </pattern>
  </defs>
  <rect width="320" height="240" fill="url(#techGrid)"/>
  
  <!-- Registration Crosshairs (+) -->
  <g stroke="currentColor" stroke-width="1" stroke-opacity="0.35">
    <!-- Top Left -->
    <path d="M 35 40 L 45 40 M 40 35 L 40 45"/>
    <!-- Top Right -->
    <path d="M 275 40 L 285 40 M 280 35 L 280 45"/>
    <!-- Center -->
    <path d="M 155 120 L 165 120 M 160 115 L 160 125"/>
    <!-- Bottom Left -->
    <path d="M 35 200 L 45 200 M 40 195 L 40 205"/>
    <!-- Bottom Right -->
    <path d="M 275 200 L 285 200 M 280 195 L 280 205"/>
  </g>
  
  <!-- Outer Corner Crop Marks -->
  <g stroke="currentColor" stroke-width="1.25" stroke-opacity="0.4">
    <path d="M 10 25 V 10 H 25"/>
    <path d="M 310 25 V 10 H 295"/>
    <path d="M 10 215 V 230 H 25"/>
    <path d="M 310 215 V 230 H 295"/>
  </g>

  <!-- Accent Blue Registration Point -->
  <circle cx="160" cy="120" r="2" fill="#3157FF"/>
</svg>
